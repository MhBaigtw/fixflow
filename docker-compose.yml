# Optional. Local development does not need Docker (see README).
# Usage: set SECRET_KEY and DEMO_PASSWORD in your shell or .env, then
#   docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fixflow
      POSTGRES_PASSWORD: fixflow-compose-only
      POSTGRES_DB: fixflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://fixflow:fixflow-compose-only@db:5432/fixflow
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      ALLOWED_HOSTS: localhost,127.0.0.1
      SECURE_SSL_REDIRECT: "False"
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
    ports:
      - "8000:8000"

volumes:
  pgdata:
